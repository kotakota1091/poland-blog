<h2>2025年12月30日　ワルシャワ</h2>

<p>
夜ごはんにミルクバーに行った。
ジャガイモのパンケーキと
マッシュルームのクリームソースの料理を食べた。
</p>

<p>
多分、ポーランド料理で一番好きかもしれない。
</p>

<p>
食べている途中、店の外で花火が上がった。
「まだ早いやろ」と呟いた。
</p>

<p>
まだ世界のどこも2026じゃないのに、
2025が終わろうとしていることに気づく。
</p>

<p>
自分だけ2025に取り残されそうな気がした。
</p>
